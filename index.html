function recs(name){

  return DATES.map((d,i)=>({d:d, cases:s.cases[i], deaths:s.deaths[i]}));
}
const WORLD = recs("World");
const worldMaxCases  = d3.max(WORLD, d=>d.cases);
const worldMaxDeaths = d3.max(WORLD, d=>d.deaths);
const vaxDate  = parse("2020-12-14");
const omicron  = WORLD.reduce((a,b)=> b.cases>a.cases ? b : a);

// ============ PARAMETERS ============  (the complete visualization state)
var params = { scene: 0, mode: "intro", group: "continents",
               contSel: CONTINENTS.slice(),
               ctrySel: ["United States","India","Sweden","South Korea"],
               metric: "cases", scale: "total" };
function activeSel(){ return params.group==="continents" ? params.contSel : params.ctrySel; }

// ============ LAYOUT & SCALES ============
const W=900, H=440, m={t:16,r:24,b:40,l:66};
const iw=W-m.l-m.r, ih=H-m.t-m.b;
const g   = d3.select("#chart").append("g").attr("transform",`translate(${m.l},${m.t})`);
const plot= g.append("g");
const anno= g.append("g");
const x   = d3.scaleTime().domain(d3.extent(DATES)).range([0,iw]);
const color = d3.scaleOrdinal().range(d3.schemeCategory10);
const tip = d3.select("#tip");
const fmtDate = d3.timeFormat("%b %-d, %Y");
const fmtInt  = d3.format(",");
const fmtDec  = d3.format(",.1f");

// ============ ANNOTATION TEMPLATE ============
function annotate(px,py,title,lines,dx,dy){
  const bw=220, lh=14, bh=18+lines.length*lh;
  let bx=px+dx, by=py+dy;
  bx=Math.max(0,Math.min(iw-bw,bx)); by=Math.max(0,Math.min(ih-bh,by));
  anno.append("line").attr("class","anno-line").attr("x1",px).attr("y1",py).attr("x2",bx+bw/2).attr("y2",by<py?by+bh:by);
  anno.append("circle").attr("cx",px).attr("cy",py).attr("r",5).attr("fill","none").attr("stroke","#333").attr("stroke-width",1.4);
  anno.append("rect").attr("class","anno-box").attr("x",bx).attr("y",by).attr("width",bw).attr("height",bh).attr("rx",4);
  anno.append("text").attr("class","anno-title").attr("x",bx+8).attr("y",by+15).text(title);
  lines.forEach((l,i)=>anno.append("text").attr("class","anno-text").attr("x",bx+8).attr("y",by+15+lh+i*lh).text(l));
}
function drawAxes(y,ylabel){
  plot.append("g").attr("transform",`translate(0,${ih})`).call(d3.axisBottom(x).ticks(8));
  plot.append("g").call(d3.axisLeft(y).tickFormat(d3.format("~s")));
  plot.append("text").attr("transform","rotate(-90)").attr("x",-ih/2).attr("y",-52).attr("text-anchor","middle").style("font-size","12px").text(ylabel);
}
function vaxMarker(){
  plot.append("line").attr("class","vax-line").attr("x1",x(vaxDate)).attr("x2",x(vaxDate)).attr("y1",0).attr("y2",ih);
  plot.append("text").attr("class","vax-label").attr("x",x(vaxDate)+4).attr("y",12).text("Vaccines, Dec 2020");
}
function areaLine(data,y,accessor,col,fill){
  plot.append("path").datum(data).attr("fill",col).attr("fill-opacity",fill)
      .attr("d",d3.area().x(d=>x(d.d)).y0(ih).y1(d=>y(accessor(d))));
  plot.append("path").datum(data).attr("fill","none").attr("stroke",col).attr("stroke-width",1.6)
      .attr("d",d3.line().x(d=>x(d.d)).y(d=>y(accessor(d))));
}
function valueAt(data,dt,acc){
  const bis=d3.bisector(d=>d.d).left, i=bis(data,dt);
  const a=data[Math.max(0,i-1)], b=data[Math.min(data.length-1,i)];
  return acc((b && dt-a.d>b.d-dt)?b:a);
}
function waveLabels(y){
  [["Alpha","2021-01-11"],["Delta","2021-08-26"],["Omicron","2022-01-24"]].forEach(function(L){
    const dt=parse(L[1]), v=valueAt(WORLD,dt,d=>d.cases);
    plot.append("text").attr("class","wave-label").attr("x",x(dt)).attr("y",y(v)-8).attr("text-anchor","middle").text(L[0]);
  });
}

// ============ TITLE SLIDE ============
function drawIntro(){
  const y=d3.scaleLinear().domain([0,worldMaxCases]).range([ih,0]);
  plot.append("path").datum(WORLD).attr("fill","#2c5aa0").attr("fill-opacity",.12)
      .attr("d",d3.area().x(d=>x(d.d)).y0(ih).y1(d=>y(d.cases)));
  const cx=iw/2, ty=ih*0.32;
  anno.append("text").attr("x",cx).attr("y",ty).attr("text-anchor","middle").style("font-size","28px").style("font-weight","700").style("fill","#1a1a1a").text("COVID-19: Waves, then Vaccines");
  anno.append("text").attr("x",cx).attr("y",ty+30).attr("text-anchor","middle").style("font-size","15px").style("fill","#444").text("How the pandemic came in waves — and how vaccines broke");
  anno.append("text").attr("x",cx).attr("y",ty+50).attr("text-anchor","middle").style("font-size","15px").style("fill","#444").text("the link between cases and deaths.");
  anno.append("text").attr("x",cx).attr("y",ty+88).attr("text-anchor","middle").style("font-size","12.5px").style("fill","#888").text("World, 2020–2022  ·  click Begin to start the story");
}

// ============ SCENES (the martini-glass STEM) ============
const scenes = [
 { title:"COVID arrived in waves",
   caption:"Worldwide reported cases did not climb steadily — they came in a series of distinct global waves, each driven by a new variant.",
   draw:function(){
     const y=d3.scaleLinear().domain([0,worldMaxCases]).range([ih,0]);
     drawAxes(y,"New cases / day (7-day avg)");
     areaLine(WORLD,y,d=>d.cases,"#2c5aa0",.30);
     waveLabels(y);
     annotate(x(parse("2020-08-01")),y(valueAt(WORLD,parse("2020-08-01"),d=>d.cases)),"Waves, not a steady climb",["Each hump is a separate surge,","driven by a new variant"],-150,-300);
   }},
 { title:"Vaccines begin rolling out (Dec 2020)",
   caption:"Mass vaccination began in December 2020 — about a year into the pandemic, and before the two largest case waves.",
   draw:function(){
     const y=d3.scaleLinear().domain([0,worldMaxCases]).range([ih,0]);
     drawAxes(y,"New cases / day (7-day avg)");
     areaLine(WORLD,y,d=>d.cases,"#2c5aa0",.30);
     vaxMarker();
     annotate(x(vaxDate),y(worldMaxCases*0.5),"Vaccine rollout",["First mass vaccinations,","then the biggest waves hit"],-40,-30);
   }},
 { title:"After vaccines, deaths decoupled from cases",
   caption:"Scaling each curve to its own peak reveals the shift: the Omicron wave set case records, yet deaths stayed far below their earlier peaks — the link between cases and deaths had weakened.",
   draw:function(){
     const y=d3.scaleLinear().domain([0,100]).range([ih,0]);
     drawAxes(y,"% of that metric's own peak");
     vaxMarker();
     plot.append("path").datum(WORLD).attr("fill","none").attr("stroke","#2c5aa0").attr("stroke-width",1.7)
         .attr("d",d3.line().x(d=>x(d.d)).y(d=>y(100*d.cases/worldMaxCases)));
     plot.append("path").datum(WORLD).attr("fill","none").attr("stroke","#c0392b").attr("stroke-width",1.7)
         .attr("d",d3.line().x(d=>x(d.d)).y(d=>y(100*d.deaths/worldMaxDeaths)));
     const lg=plot.append("g").attr("class","legend").attr("transform","translate(12,4)");
     [["Cases","#2c5aa0"],["Deaths","#c0392b"]].forEach(function(e,i){
       const row=lg.append("g").attr("transform",`translate(0,${i*15})`);
       row.append("rect").attr("width",12).attr("height",3).attr("y",-2).attr("fill",e[1]);
       row.append("text").attr("x",18).attr("y",3).text(e[0]);
     });
     annotate(x(omicron.d),y(100),"Omicron",["Record cases (100%),","but deaths stayed far lower"],-30,64);
   }}
];

// ============ EXPLORE (the martini-glass BOWL: compare continents or countries) ============
function drawExplore(){
  const sel    = activeSel();
  const base   = params.metric==="cases" ? (d=>d.cases) : (d=>d.deaths);
  const factorOf = c => params.scale==="percap" ? 1/(POP[c]||1) : 1;
  const unit   = params.metric + (params.scale==="percap" ? "/day per million" : "/day");
  color.domain(sel);
  const series = sel.map(c => ({name:c, data:recs(c), f:factorOf(c)}));
  const ymax   = d3.max(series, s => d3.max(s.data, d=>base(d)*s.f)) || 1;
  const y      = d3.scaleLinear().domain([0,ymax]).range([ih,0]);
  drawAxes(y, "New "+unit+" (7-day avg)");
  vaxMarker();

  series.forEach(function(s){
    plot.append("path").datum(s.data).attr("fill","none").attr("stroke",color(s.name)).attr("stroke-width",1.6)
        .attr("d", d3.line().x(d=>x(d.d)).y(d=>y(base(d)*s.f)));
  });

  const lg=plot.append("g").attr("class","legend").attr("transform","translate(12,4)");
  series.forEach(function(s,i){
    const row=lg.append("g").attr("transform",`translate(0,${i*15})`);
    row.append("rect").attr("width",12).attr("height",3).attr("y",-2).attr("fill",color(s.name));
    row.append("text").attr("x",18).attr("y",3).text(s.name);
  });

  const guide=plot.append("line").attr("class","guide").attr("y1",0).attr("y2",ih).style("display","none");
  const dots = series.map(s => plot.append("circle").attr("r",3.5).attr("fill",color(s.name)).attr("stroke","#fff").style("display","none"));
  const bisect=d3.bisector(d=>d.d).left;
  const fmt = params.scale==="percap" ? fmtDec : fmtInt;
  plot.append("rect").attr("width",iw).attr("height",ih).attr("fill","none").style("pointer-events","all")
    .on("mousemove", function(){
       const d0=x.invert(d3.mouse(this)[0]);
       var rows="", dt=null;
       series.forEach(function(s,i){
         const j=bisect(s.data,d0), a=s.data[Math.max(0,j-1)], b=s.data[Math.min(s.data.length-1,j)];
         const d=(b && d0-a.d>b.d-d0)?b:a, v=base(d)*s.f; dt=d.d;
         dots[i].attr("cx",x(d.d)).attr("cy",y(v)).style("display",null);
         rows+="<div><span style='color:"+color(s.name)+"'>&#9632;</span> "+s.name+": <b>"+fmt(v)+"</b></div>";
       });
       guide.attr("x1",x(dt)).attr("x2",x(dt)).style("display",null);
       var lx=d3.event.clientX+14;
       if(lx+190 > window.innerWidth) lx=d3.event.clientX-204;
       tip.style("display","block").style("left",lx+"px").style("top",(d3.event.clientY-10)+"px")
          .html("<b>"+fmtDate(dt)+"</b> ("+unit+")"+rows);
    })
    .on("mouseout", function(){ guide.style("display","none"); dots.forEach(function(dd){dd.style("display","none");}); tip.style("display","none"); });
}

// ============ PICKER (continent chips  or  country add-menu + chips) ============
function buildPicker(){
  const p=d3.select("#picker"); p.selectAll("*").remove();
  const sel=activeSel(); color.domain(sel);
  if(params.group==="continents"){
    CONTINENTS.forEach(function(c){
      const on=sel.indexOf(c)>=0;
      p.append("button").text(c)
       .style("background",on?color(c):null).style("color",on?"#fff":null).style("border-color",on?color(c):"#bbb")
       .on("click",function(){ toggleSel(c); });
    });
  } else {
    const add=p.append("select");
    add.append("option").attr("value","").text("+ Add a country…");
    COUNTRYNAMES.filter(function(n){return sel.indexOf(n)<0;}).forEach(function(n){ add.append("option").attr("value",n).text(n); });
    add.on("change",function(){ if(this.value){ toggleSel(this.value); } });
    sel.forEach(function(c){
      p.append("button").html(c+" &#10005;")
       .style("background",color(c)).style("color","#fff").style("border-color",color(c))
       .on("click",function(){ toggleSel(c); });
    });
  }
}
function toggleSel(name){
  const arr=activeSel(), i=arr.indexOf(name);
  if(i>=0){ if(arr.length>1) arr.splice(i,1); }
  else if(arr.length<8){ arr.push(name); }
  render();
}

// ============ RENDER ============
function render(){
  plot.selectAll("*").remove(); anno.selectAll("*").remove(); tip.style("display","none");
  const intro = params.mode==="intro", stem = params.mode==="stem", explore = params.mode==="explore";
  d3.select("#stem-nav").style("display", explore ? "none" : "flex");
  d3.select("#explore-nav").style("display", explore ? "flex" : "none");
  d3.select("#picker").style("display", explore ? "flex" : "none");
  d3.select("#back").style("display", intro?"none":null);
  d3.select("#count").style("display", intro?"none":null);
  d3.select("#title").style("display", intro?"none":null);

  if(intro){
    drawIntro();
    d3.select("#caption").text("");
    d3.select("#next").html("Begin &#9654;");
  } else if(stem){
    scenes[params.scene].draw();
    d3.select("#title").text(scenes[params.scene].title);
    d3.select("#caption").text(scenes[params.scene].caption);
    d3.select("#count").text("Scene "+(params.scene+1)+" of "+scenes.length);
    d3.select("#back").property("disabled", params.scene===0);
    d3.select("#next").html(params.scene===scenes.length-1 ? "Explore the data &#9654;" : "Next &#9654;");
  } else {
    drawExplore();
    buildPicker();
    const per = params.scale==="percap" ? " per million people" : "";
    const g1 = params.group==="continents" ? "continents" : "countries";
    const how = params.group==="continents" ? "Click a continent to add or remove it. " : "Use the menu to add a country; click a chip to remove it. ";
    d3.select("#caption").text("Comparing "+g1+" — daily new "+params.metric+per+" (7-day average). "+how+"Switch metric or scale; hover for values.");
    d3.selectAll("#group button").classed("active", function(){ return this.getAttribute("data-g")===params.group; });
    d3.selectAll("#metric button").classed("active", function(){ return this.getAttribute("data-m")===params.metric; });
    d3.selectAll("#scale button").classed("active", function(){ return this.getAttribute("data-s")===params.scale; });
  }
}

// ============ TRIGGERS ============
d3.select("#next").on("click", function(){
  if(params.mode==="intro"){ params.mode="stem"; params.scene=0; }
  else if(params.scene < scenes.length-1){ params.scene++; }
  else { params.mode="explore"; }
  render();
});
d3.select("#back").on("click", function(){ if(params.scene>0){ params.scene--; render(); } });
d3.select("#replay").on("click", function(){ params.mode="stem"; params.scene=scenes.length-1; render(); });
d3.selectAll("#group button").on("click", function(){ params.group=this.getAttribute("data-g"); render(); });
d3.selectAll("#metric button").on("click", function(){ params.metric=this.getAttribute("data-m"); render(); });
d3.selectAll("#scale button").on("click", function(){ params.scale=this.getAttribute("data-s"); render(); });

render();
</script>
</body>
</html>
